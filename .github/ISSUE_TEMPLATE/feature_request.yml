name: Feature request
description: Suggest a new feature or an improvement to 900CRM
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! 900CRM is built for businesses in developing
        economies, so we especially value suggestions that improve offline use,
        affordability, and accessibility.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem or frustration your idea would address.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your proposed solution
      description: What would you like 900CRM to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Any other approaches, workarounds, or tools you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Contacts
        - Pipeline / Deals
        - Activities
        - Dashboard
        - Search
        - Import / Export
        - Backup / Restore
        - Settings
        - Internationalization / Translations
        - Performance
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting, you agree to follow our [Code of Conduct](../CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
