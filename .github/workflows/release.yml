name: Manual Release Packaging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to publish from. Required only when publish_github_release is true.
        required: false
        default: ''
      release_title:
        description: Release title for metadata and optional GitHub Release creation.
        required: false
        default: ''
      release_version:
        description: Version label to write into release metadata.
        required: true
        default: 1.0.0
      publish_github_release:
        description: Attach artifacts to a GitHub Release. Requires running this workflow from the matching tag.
        type: boolean
        required: true
        default: false
      release_draft:
        description: Create the GitHub Release as a draft when publishing is enabled.
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate sample release manifest
        run: npm run release:manifest:sample

      - name: Check public release guardrails
        run: npm run check:release-guardrails

      - name: Lint frontend tooling
        run: npm run lint

      - name: Check frontend types
        run: npm run check

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace -- -D warnings

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Test Rust workspace
        run: cargo test --workspace

  package:
    name: Package ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
          - platform: macos
            os: macos-latest
            bundles: dmg
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Tauri bundles
        env:
          CI: true
        run: npm run tauri -- build -- --bundles ${{ matrix.bundles }}

      - name: Generate release metadata, checksums, and SBOM
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          release_title="${RELEASE_TITLE:-900CRM ${RELEASE_VERSION}}"

          node scripts/generate-release-manifest.mjs \
            --artifact-dir target/release/bundle \
            --out-dir release-assets/${{ matrix.platform }} \
            --platform ${{ matrix.platform }} \
            --release-version "$RELEASE_VERSION" \
            --release-title "$release_title" \
            --release-ref "${{ github.ref_name }}" \
            --release-sha "${{ github.sha }}"
        shell: bash

      - name: Upload packaged desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 900crm-${{ inputs.release_version }}-${{ matrix.platform }}-packages
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip

      - name: Upload release metadata artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 900crm-${{ inputs.release_version }}-${{ matrix.platform }}-release-metadata
          if-no-files-found: error
          path: release-assets/${{ matrix.platform }}/*

  publish_github_release:
    name: Publish GitHub Release
    needs: package
    if: ${{ inputs.publish_github_release == true || inputs.publish_github_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-download

      - name: Validate explicit tag guard
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag is required when publish_github_release is true." >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "release_tag must start with v when publish_github_release is true." >&2
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Publishing requires running this workflow from refs/tags/$RELEASE_TAG." >&2
            echo "Current ref is $GITHUB_REF." >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - name: Create guarded GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.release_draft }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          release_title="${RELEASE_TITLE:-900CRM ${RELEASE_VERSION}}"

          cat > release-notes.md <<EOF
          ${release_title}

          This release was packaged by the manual release workflow.

          Scope:
          - Windows, macOS, and Linux Tauri bundles from the workflow matrix.
          - SHA-256 checksum files and release metadata generated per platform.
          - SPDX-shaped dependency inventory generated from package-lock.json and Cargo.lock.

          Boundaries:
          - Artifacts are not signed.
          - macOS artifacts are not notarized.
          - No update channel, telemetry, crash reporting, or credential handling is configured.
          EOF

          mapfile -d '' release_files < <(
            find release-download -type f \( \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.deb' -o \
              -name '*.AppImage' -o \
              -name '*.rpm' -o \
              -name '*.tar.gz' -o \
              -name '*.zip' -o \
              -name '*-SHA256SUMS.txt' -o \
              -name '*-release-metadata.json' -o \
              -name '*-sbom.spdx.json' \
            \) -print0 | sort -z
          )

          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found to upload." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${release_files[@]}" --clobber
          else
            release_args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$release_title"
              --notes-file release-notes.md
              --verify-tag
            )

            if [ "$RELEASE_DRAFT" = "true" ]; then
              release_args+=(--draft)
            fi

            gh "${release_args[@]}" "${release_files[@]}"
          fi
